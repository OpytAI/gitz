# gitz package inventory — machine-readable source of truth.
# Checked by //check:file_inventory. Update in the same change set as new surface.
#
# pin: must match GO_GIT_PIN.md
# current_phase: g | 1..13  (updated only when a phase merges to develop)
# phase rank: g=0, 1=1, … 13=13
# status (lowercase only; unknown values fail the checker):
#   required  — package root must contain ≥1 direct *.zig once phase <= current_phase
#               (non-recursive: child packages do not satisfy parent rows)
#   deferred  — same enforcement as required (use higher phase to postpone)
#   excluded  — out of port scope (no zig tree expected)
#   test_only — helpers / suites; not production library surface

pin: v5.19.2
# Feature branch: enforce phase-7 packages. Bump on develop only after merge review.
current_phase: 8

