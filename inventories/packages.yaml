# gitz package inventory — machine-readable source of truth.
# Checked by //check:file_inventory. Update in the same change set as new surface.
#
# pin: must match GO_GIT_PIN.md
# status (lowercase only; unknown values fail the checker):
#   required  — package root must contain at least one direct *.zig file
#   deferred  — same enforcement as required
#   excluded  — out of port scope (no zig tree expected)
#   test_only — helpers / suites; not production library surface
# Package checks are non-recursive. Child packages do not satisfy parent rows.

pin: v5.19.2

packages:
