# Go constructors NewEncoder/NewScanner map to Zig Encoder.init / Scanner.init.
package: plumbing/format/pktline
require:
  types:
    - Encoder
    - Scanner
    - ErrorLine
  functions:
    - NewEncoder
    - NewScanner
  constants:
    - MaxPayloadSize
    - OversizePayloadMax
    - FlushPkt
    - Flush
    - FlushString
  semantic:
    - Encoder
    - Scanner
    - ErrorLine
    - Encoder.init
    - Scanner.init
    - Encoder.flush
    - Encoder.encode
    - Encoder.encodeLine
    - Encoder.encodeString
    - Encoder.encodef
    - Scanner.scan
    - Scanner.bytes
    - Scanner.err
    - Scanner.errorLineText
    - ErrorLine.encode
    - ErrorLine.decode
    - MaxPayloadSize
    - OversizePayloadMax
    - FlushPkt
    - Flush
    - FlushString
zig_map:
  Encoder: Encoder
  Scanner: Scanner
  ErrorLine: ErrorLine
  NewEncoder: Encoder.init
  NewScanner: Scanner.init
  MaxPayloadSize: MaxPayloadSize
  OversizePayloadMax: OversizePayloadMax
  FlushPkt: FlushPkt
  Flush: Flush
  FlushString: FlushString
