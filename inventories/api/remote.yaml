# API inventory: remote (phase 11) — go-git root remote.go + remote options.
# packages.yaml go key is git/remote (zig: src/remote).
#
# Present: Remote, NewRemote, List/Fetch/Push, options, force-with-lease,
# follow-tags (IsAncestor), updateShallow, SessionOpts (TLS/mTLS/proxy on Endpoint),
# Progress / no-progress on fetch+push, in-process MapLoader path via newRemoteEmbedded.
# Network HTTP/SSH transports are phase 13; PlainClone is phase 12.
# In-process MapLoader path is complete including depth/shallow, prune, FWL.
package: git/remote
phase: 11
require:
  types:
    - Remote
    - FetchOptions
    - PushOptions
    - ListOptions
    - TagMode
    - PeelingOption
    - ForceWithLease
    - PushOption
    - SessionOpts
    - SessionUpload
    - SessionReceive
    - CalculateRefsResult
  functions:
    - newRemote
    - newRemoteEmbedded
    - freeReferences
    - transportFromServer
    - sessionOptsFrom
    - openUploadPack
    - openReceivePack
    - calculateRefs
    - getWants
    - getHaves
    - isFastForward
  constants:
    - default_remote_name
    - default_list_timeout_sec
  semantic:
    - Remote
    - Remote.list
    - Remote.fetch
    - Remote.push
    - Remote.string
    - Remote.name
    - newRemote
    - newRemoteEmbedded
    - freeReferences
    - FetchOptions
    - FetchOptions.validate
    - FetchOptions.progress
    - FetchOptions.client_cert
    - FetchOptions.client_key
    - FetchOptions.ca_bundle
    - PushOptions
    - PushOptions.validate
    - PushOptions.progress
    - PushOptions.client_cert
    - PushOptions.client_key
    - PushOptions.ca_bundle
    - ListOptions
    - ListOptions.effectiveTimeoutSec
    - ListOptions.client_cert
    - ListOptions.client_key
    - ListOptions.ca_bundle
    - TagMode
    - PeelingOption
    - ForceWithLease
    - PushOption
    - SessionOpts
    - sessionOptsFrom
    - AlreadyUpToDate
    - EmptyUrls
    - ForceWithLeaseRejected
    - NoMatchingRefSpec
    - DeleteRefNotSupported
    - ForceNeeded
    - ExactSHA1NotSupported
    - InvalidTimeout
    - RequireRemoteRefsFailed
    - default_remote_name
    - openReceivePack
    - isFastForward
zig_map:
  Remote: Remote
  NewRemote: newRemote
  NewRemoteEmbedded: newRemoteEmbedded
  FetchOptions: FetchOptions
  PushOptions: PushOptions
  ListOptions: ListOptions
  TagMode: TagMode
  PeelingOption: PeelingOption
  ForceWithLease: ForceWithLease
  PushOption: PushOption
  SessionOpts: SessionOpts
  sessionOptsFrom: sessionOptsFrom
  DefaultRemoteName: default_remote_name
  NoErrAlreadyUpToDate: AlreadyUpToDate
  ErrEmptyUrls: EmptyUrls
  ErrForceNeeded: ForceNeeded
  ErrDeleteRefNotSupported: DeleteRefNotSupported
  ErrExactSHA1NotSupported: ExactSHA1NotSupported
  NoMatchingRefSpecError: NoMatchingRefSpec
  ErrInvalidTimeout: InvalidTimeout
  ErrRequireRemoteRefs: RequireRemoteRefsFailed
  freeReferences: freeReferences
  transportFromServer: transportFromServer
  openUploadPack: openUploadPack
  openReceivePack: openReceivePack
  newSendPackSession: openReceivePack
  calculateRefs: calculateRefs
  getWants: getWants
  getHaves: getHaves
  isFastForward: isFastForward
  SessionUpload: SessionUpload
  SessionReceive: SessionReceive
  CalculateRefsResult: CalculateRefsResult
