# API inventory: remote (phase 11) — go-git root remote.go + remote options.
# packages.yaml go key is git/remote (zig: src/remote).
#
# Present: Remote, NewRemote, List/Fetch/Push, TransportClientOpts, SessionOpts,
# force-with-lease, follow-tags (IsAncestor), updateShallow, depth/shallow server,
# Progress / no-progress, MapLoader path, Repository.fetch/push glue.
# Network HTTP/SSH: phase 13. PlainClone: phase 12.
package: git/remote
phase: 11
require:
  types:
    - Remote
    - FetchOptions
    - PushOptions
    - ListOptions
    - TransportClientOpts
    - transport.OperationContext
    - TagMode
    - PeelingOption
    - ForceWithLease
    - PushOption
    - SessionOpts
    - SessionUpload
    - SessionReceive
    - CalculateRefsResult
  functions:
    - newRemote
    - newRemoteEmbedded
    - freeReferences
    - transportFromServer
    - openUploadPack
    - openUploadPackUrl
    - openReceivePack
    - openReceivePackUrl
    - calculateRefs
    - getWants
    - getHaves
    - isFastForward
  constants:
    - default_remote_name
    - default_list_timeout_sec
  semantic:
    - Remote
    - Remote.list
    - Remote.fetch
    - Remote.push
    - Remote.string
    - Remote.name
    - newRemote
    - newRemoteEmbedded
    - freeReferences
    - FetchOptions
    - FetchOptions.validate
    - PushOptions
    - PushOptions.validate
    - ListOptions
    - ListOptions.effectiveTimeoutSec
    - TransportClientOpts
    - TransportClientOpts.operation_context
    - SessionOpts
    - SessionOpts.fromClient
    - TagMode
    - PeelingOption
    - ForceWithLease
    - PushOption
    - AlreadyUpToDate
    - EmptyUrls
    - ForceWithLeaseRejected
    - NoMatchingRefSpec
    - DeleteRefNotSupported
    - ForceNeeded
    - ExactSHA1NotSupported
    - InvalidTimeout
    - ListTimeout
    - RequireRemoteRefsFailed
    - default_remote_name
    - openReceivePack
    - openReceivePackUrl
    - openUploadPackUrl
    - isFastForward
    - client_cert
    - progress
zig_map:
  Remote: Remote
  NewRemote: newRemote
  NewRemoteEmbedded: newRemoteEmbedded
  FetchOptions: FetchOptions
  PushOptions: PushOptions
  ListOptions: ListOptions
  TransportClientOpts: TransportClientOpts
  OperationContext: OperationContext
  TagMode: TagMode
  PeelingOption: PeelingOption
  ForceWithLease: ForceWithLease
  PushOption: PushOption
  SessionOpts: SessionOpts
  DefaultRemoteName: default_remote_name
  NoErrAlreadyUpToDate: AlreadyUpToDate
  ErrEmptyUrls: EmptyUrls
  ErrForceNeeded: ForceNeeded
  ErrDeleteRefNotSupported: DeleteRefNotSupported
  ErrExactSHA1NotSupported: ExactSHA1NotSupported
  NoMatchingRefSpecError: NoMatchingRefSpec
  ErrInvalidTimeout: InvalidTimeout
  ErrListTimeout: ListTimeout
  ErrRequireRemoteRefs: RequireRemoteRefsFailed
  freeReferences: freeReferences
  transportFromServer: transportFromServer
  openUploadPack: openUploadPack
  openUploadPackUrl: openUploadPackUrl
  openReceivePack: openReceivePack
  openReceivePackUrl: openReceivePackUrl
  newSendPackSession: openReceivePack
  calculateRefs: calculateRefs
  getWants: getWants
  getHaves: getHaves
  isFastForward: isFastForward
  SessionUpload: SessionUpload
  SessionReceive: SessionReceive
  CalculateRefsResult: CalculateRefsResult
