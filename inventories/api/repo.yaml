    - Repository.tagObjects
    - Repository.objects
    - Repository.branches
    - Repository.tags
    - Repository.notes
    - Repository.log
    - Repository.resolveRevision
    - newRepository
    - init
    - initWithOptions
    - open
    - git_dir_name
    - Remote
    - CreateTagOptions
    - CreateTagOptions.tagger
    - CreateTagOptions.message
    - CreateTagOptions.pgp_signature
    - CreateTagOptions.validate
    - LogOptions.from
