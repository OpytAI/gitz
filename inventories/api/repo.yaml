# API inventory: repo (phase 10) — go-git root repository partial
# packages.yaml go key is git/repository (zig: src/repo).
#
# Present: Init/Open (memory), PlainInit/PlainOpen (fs.Mem), configScoped,
# Log (+ PathFilter fields), CreateTagOptions (tagger/message/pgp_signature),
# CRUD remotes/branches/tags, object facades, ResolveRevision.
# Deferred: PlainClone; full Worktree engine (phase 12); Remote Fetch/List/Push
# (phase 11); EnableDotGitCommonDir (stub flag).
package: git/repository
phase: 10
require:
  types:
    - Repository
    - InitOptions
    - LogOptions
    - LogOrder
    - LogResult
    - Remote
    - CreateTagOptions
    - AnonymousRemote
    - PlainInitOptions
    - PlainOpenOptions
    - PlainRepository
