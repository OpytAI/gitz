    - init
    - initWithOptions
    - open
    - configScoped
    - configScopedFromLocal
    - createTag
    - log
    - plainInit
    - plainInitWithOptions
    - plainOpen
    - plainOpenWithOptions
  constants:
    - git_dir_name
  semantic:
    - Repository
    - Repository.config
    - Repository.setConfig
    - Repository.configScoped
    - Repository.head
    - Repository.reference
    - Repository.references
    - Repository.isBare
    - Repository.setIsBare
    - Repository.worktreeFs
    - Repository.remote
    - Repository.remotes
    - Repository.createRemote
    - Repository.createRemoteAnonymous
    - Repository.deleteRemote
    - Repository.branch
    - Repository.createBranch
    - Repository.deleteBranch
    - Repository.tag
