# Go NewEncoder maps to Zig Encoder.init; DiffDelta/GetDelta keep go names as zig_map
# targets diffDelta/getDelta (package-root re-exports, same style as patchDelta).
package: plumbing/format/packfile
require:
  types:
    - Scanner
    - ObjectHeader
    - Parser
    - Observer
    - ObjectStore
    - Packfile
    - ObjectIterator
    - Encoder
    - ObjectToPack
    - DeltaIndex
    - DeltaSelector
    - Store
    - FSObject
    - FSObjectReader
  functions:
    - NewScanner
    - NewParser
    - NewPackfile
    - PatchDelta
    - ApplyDelta
    - ReaderFromDelta
    - NewEncoder
    - DiffDelta
    - GetDelta
    - DiffDeltaWithIndex
    - GetDeltaWithIndex
    - NewObjectToPack
    - NewDeltaObjectToPack
    - FreeObjectsToPack
    - UpdateObjectStorage
    - WritePackfileToObjectStorage
    - FSObjectFor
  constants:
    - VersionSupported
  semantic:
    - Scanner
    - Scanner.init
    - Scanner.initSeekable
    - Scanner.header
    - Scanner.nextObjectHeader
    - Scanner.nextObject
    - Scanner.readObject
    - Scanner.seekObjectHeader
    - Scanner.checksum
    - Scanner.reset
    - Scanner.resetSeekable
    - ObjectHeader
    - Parser
    - Parser.init
    - Parser.initWithStorage
    - Parser.parse
    - Observer
    - ObjectStore
    - Packfile
    - Packfile.init
    - Packfile.get
    - Packfile.getByOffset
    - Packfile.getAll
    - Packfile.getByType
    - Packfile.getSizeByOffset
    - Packfile.id
    - Packfile.close
    - ObjectIterator
    - FSObject
    - FSObject.hash
    - FSObject.size
    - FSObject.objectType
    - FSObject.reader
    - FSObjectReader
    - FSObjectReader.close
    - FSObjectFor
    - patchDelta
    - applyDelta
    - readerFromDelta
    - applyDeltaFromReader
    - VersionSupported
    - signature
    - max_delta_chain_depth
    - Encoder
    - Encoder.init
    - Encoder.initFrom
    - Encoder.encode
    - Encoder.encodeObjects
    - ObjectToPack
    - ObjectToPack.isDelta
    - ObjectToPack.backToOriginal
    - ObjectToPack.isWritten
    - ObjectToPack.markWantWrite
    - ObjectToPack.wantWrite
    - ObjectToPack.setOriginal
    - ObjectToPack.saveOriginalMetadata
    - ObjectToPack.cleanOriginal
    - ObjectToPack.setDelta
    - ObjectToPack.objectType
    - ObjectToPack.objectHash
    - ObjectToPack.objectSize
    - newObjectToPack
    - newDeltaObjectToPack
    - DeltaIndex
    - diffDelta
    - getDelta
    - getDeltaWithIndex
    - diffDeltaWithIndex
    - DeltaSelector
    - DeltaSelector.init
    - Store
    - freeObjectsToPack
    - updateObjectStorage
    - writePackfileToObjectStorage
zig_map:
  Scanner: Scanner
  ObjectHeader: ObjectHeader
  Parser: Parser
  Observer: Observer
  ObjectStore: ObjectStore
  Packfile: Packfile
  ObjectIterator: ObjectIterator
  FSObject: FSObject
  FSObjectReader: FSObjectReader
  FSObjectFor: FSObjectFor
  NewScanner: Scanner.init
  NewParser: Parser.init
  NewPackfile: Packfile.init
  PatchDelta: patchDelta
  ApplyDelta: applyDelta
  ReaderFromDelta: readerFromDelta
  VersionSupported: VersionSupported
  Encoder: Encoder
  ObjectToPack: ObjectToPack
  DeltaIndex: DeltaIndex
  DeltaSelector: DeltaSelector
  Store: Store
  NewEncoder: Encoder.init
  DiffDelta: diffDelta
  GetDelta: getDelta
  DiffDeltaWithIndex: diffDeltaWithIndex
  GetDeltaWithIndex: getDeltaWithIndex
  NewObjectToPack: newObjectToPack
  NewDeltaObjectToPack: newDeltaObjectToPack
  FreeObjectsToPack: freeObjectsToPack
  UpdateObjectStorage: updateObjectStorage
  WritePackfileToObjectStorage: writePackfileToObjectStorage
