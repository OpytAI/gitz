# API inventory: plumbing/format/packfile (phase 3 read + phase 5 encoder)
# Encoder / DiffDelta / GetDelta / ObjectToPack land in phase 5.
# Go NewEncoder maps to Zig Encoder.init; DiffDelta/GetDelta keep go names as zig_map
# targets diffDelta/getDelta (package-root re-exports, same style as patchDelta).
package: plumbing/format/packfile
phase: 3
require:
  types:
    - Scanner
    - ObjectHeader
    - Parser
    - Observer
    - ObjectStore
    - Packfile
    - ObjectIterator
    - Encoder
    - ObjectToPack
  functions:
    - NewScanner
    - NewParser
    - NewPackfile
    - PatchDelta
    - ApplyDelta
    - ReaderFromDelta
    - NewEncoder
    - DiffDelta
    - GetDelta
  constants:
    - VersionSupported
  semantic:
    - Scanner
    - Scanner.init
    - Scanner.initSeekable
    - Scanner.header
    - Scanner.nextObjectHeader
    - Scanner.nextObject
    - Scanner.readObject
    - Scanner.seekObjectHeader
    - Scanner.checksum
    - Scanner.reset
    - Scanner.resetSeekable
    - ObjectHeader
    - Parser
    - Parser.init
    - Parser.initWithStorage
    - Parser.parse
    - Observer
    - ObjectStore
    - Packfile
    - Packfile.init
    - Packfile.get
    - Packfile.getByOffset
    - Packfile.getAll
    - Packfile.getByType
    - Packfile.getSizeByOffset
    - Packfile.id
    - Packfile.close
    - ObjectIterator
    - patchDelta
    - applyDelta
    - readerFromDelta
    - applyDeltaFromReader
    - VersionSupported
    - signature
    - max_delta_chain_depth
    # Phase 5 write path (package-root re-exports)
    - Encoder
    - Encoder.init
    - Encoder.encode
    - ObjectToPack
    - ObjectToPack.isDelta
    - ObjectToPack.backToOriginal
    - ObjectToPack.isWritten
    - ObjectToPack.markWantWrite
    - ObjectToPack.wantWrite
    - ObjectToPack.setOriginal
    - ObjectToPack.saveOriginalMetadata
    - ObjectToPack.cleanOriginal
    - ObjectToPack.setDelta
    - ObjectToPack.type
    - ObjectToPack.hash
    - ObjectToPack.size
    - diffDelta
    - getDelta
zig_map:
  Scanner: Scanner
  ObjectHeader: ObjectHeader
  Parser: Parser
  Observer: Observer
  ObjectStore: ObjectStore
  Packfile: Packfile
  ObjectIterator: ObjectIterator
  NewScanner: Scanner.init
  NewParser: Parser.init
  NewPackfile: Packfile.init
  PatchDelta: patchDelta
  ApplyDelta: applyDelta
  ReaderFromDelta: readerFromDelta
  VersionSupported: VersionSupported
  Encoder: Encoder
  ObjectToPack: ObjectToPack
  NewEncoder: Encoder.init
  DiffDelta: diffDelta
  GetDelta: getDelta
