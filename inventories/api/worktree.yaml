# packages.yaml go key is git/worktree (zig: src/worktree).
#
# Present: Worktree status/add/commit/checkout/reset/pull/clean, Status map,
# StatusCode/FileStatus, Checkout/Reset/Add/Commit/Pull/Clone/Clean options,
# Move/RemoveGlob/AddGlob/resetSparsely, platform fillSystemInfo.
# Restore / Grep (+ options/results) are inventory-required residuals; implement
package: git/worktree
require:
  types:
    - Worktree
    - Status
    - StatusCode
    - FileStatus
    - StatusStrategy
    - StatusOptions
    - CheckoutOptions
    - ResetMode
    - ResetOptions
    - AddOptions
    - CommitOptions
    - Signer
    - PullOptions
    - SubmoduleUpdater
    - CloneOptions
    - CleanOptions
    - RestoreOptions
    - GrepOptions
    - GrepResult
  functions:
    - newWorktree
    - newWorktreeEmbedded
    - fillSystemInfo
    - Move
    - RemoveGlob
    - AddGlob
    - Restore
    - Grep
    - freeGrepResults
    - resetSparsely
  constants:
    - default_status_strategy
  semantic:
    - Worktree
    - Worktree.status
    - Worktree.statusWithOptions
    - Worktree.add
    - Worktree.addWithOptions
    - Worktree.remove
    - Worktree.removeGlob
    - Worktree.addGlob
    - Worktree.move
    - Worktree.commit
    - Worktree.checkout
    - Worktree.reset
    - Worktree.resetSparsely
    - Worktree.pull
    - Worktree.pullContext
    - Worktree.clean
    - Worktree.restore
    - Worktree.grep
    - Worktree.submodule
    - Worktree.submodules
    - newWorktree
    - newWorktreeEmbedded
    - Status
    - Status.file
    - Status.isClean
    - Status.isUntracked
    - Status.string
    - StatusCode
    - FileStatus
    - StatusStrategy
    - StatusOptions
    - CheckoutOptions
    - CheckoutOptions.validate
    - ResetMode
    - ResetOptions
    - ResetOptions.validate
    - AddOptions
    - AddOptions.validate
    - CommitOptions
    - Signer
    - CommitOptions.validate
    - PullOptions
    - SubmoduleUpdater
    - PullOptions.validate
    - CloneOptions
    - CloneOptions.validate
    - CleanOptions
    - RestoreOptions
    - GrepOptions
    - GrepResult
    - freeGrepResults
    - resetSparsely
    - fillSystemInfo
    - default_status_strategy
    - WorktreeNotClean
    - EmptyCommit
    - MissingAuthor
    - MissingURL
    - NonFastForwardUpdate
    - NoRestorePaths
    - HashOrReference
    - InvalidRegex
    - DestinationExists
    - GlobNoMatches
    - RestoreWorktreeOnlyNotSupported
zig_map:
  Worktree: Worktree
  NewWorktree: newWorktree
  NewWorktreeEmbedded: newWorktreeEmbedded
  Status: Status
  StatusCode: StatusCode
  FileStatus: FileStatus
  StatusStrategy: StatusStrategy
  StatusOptions: StatusOptions
  CheckoutOptions: CheckoutOptions
  ResetMode: ResetMode
  ResetOptions: ResetOptions
  AddOptions: AddOptions
  CommitOptions: CommitOptions
  Signer: Signer
  PullOptions: PullOptions
  SubmoduleUpdater: SubmoduleUpdater
  CloneOptions: CloneOptions
  CleanOptions: CleanOptions
  RestoreOptions: RestoreOptions
  GrepOptions: GrepOptions
  GrepResult: GrepResult
  Move: move
  RemoveGlob: removeGlob
  AddGlob: addGlob
  Restore: restore
  Grep: grep
  freeGrepResults: freeGrepResults
  ResetSparsely: resetSparsely
  fillSystemInfo: fillSystemInfo
  default_status_strategy: default_status_strategy
  ErrWorktreeNotClean: WorktreeNotClean
  ErrEmptyCommit: EmptyCommit
  ErrMissingAuthor: MissingAuthor
  ErrMissingURL: MissingURL
  ErrNonFastForwardUpdate: NonFastForwardUpdate
  ErrNoRestorePaths: NoRestorePaths
  ErrHashOrReference: HashOrReference
  InvalidRegex: InvalidRegex
  ErrDestinationExists: DestinationExists
  ErrGlobNoMatches: GlobNoMatches
  ErrRestoreWorktreeOnlyNotSupported: RestoreWorktreeOnlyNotSupported
