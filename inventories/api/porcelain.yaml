# API inventory: porcelain (phase 12) — go-git Clone / PlainClone helpers.
# packages.yaml go key is git/porcelain (zig: src/porcelain).
#
# Present: clone / cloneEmbedded, plainClone / plainCloneEmbedded, cloneInto,
# OwnedRepository, CloneOptions re-export from worktree. MapLoader path via
# embedded server. Network HTTP/SSH: phase 13.
package: git/porcelain
phase: 12
require:
  types:
    - OwnedRepository
    - CloneOptions
  functions:
    - clone
    - cloneContext
    - cloneEmbedded
    - cloneEmbeddedContext
    - plainClone
    - plainCloneContext
    - plainCloneEmbedded
    - plainCloneSharedFilesystem
    - cloneInto
    - cloneIntoContext
  constants: []
  semantic:
    - OwnedRepository
    - OwnedRepository.deinit
    - CloneOptions
    - clone
    - cloneContext
    - cloneEmbedded
    - cloneEmbeddedContext
    - plainClone
    - plainCloneContext
    - plainCloneEmbedded
    - plainCloneSharedFilesystem
    - SharedCloneRequired
    - SharedCloneOptionNotSupported
    - SharedCheckoutNotSupported
    - cloneInto
    - cloneIntoContext
    - MissingURL
    - Fetching
    - UnableToResolveCommit
    - IsBareRepository
zig_map:
  OwnedRepository: OwnedRepository
  CloneOptions: CloneOptions
  Clone: clone
  CloneContext: cloneContext
  CloneEmbedded: cloneEmbedded
  CloneEmbeddedContext: cloneEmbeddedContext
  PlainClone: plainClone
  PlainCloneContext: plainCloneContext
  PlainCloneEmbedded: plainCloneEmbedded
  PlainCloneSharedFilesystem: plainCloneSharedFilesystem
  cloneInto: cloneInto
  cloneIntoContext: cloneIntoContext
  ErrMissingURL: MissingURL
  ErrFetching: Fetching
  ErrUnableToResolveCommit: UnableToResolveCommit
  IsBareRepository: IsBareRepository
