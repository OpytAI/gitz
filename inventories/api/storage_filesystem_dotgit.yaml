# .git directory layout helpers over billy/fs.
# Go New → DotGit.new / DotGit.init; Go Initialize → initialize.
# Generic monomorphisation: DotGitFor(Fs) / ObjectWriterFor(Fs) / PackWriterFor(Fs)
# / EncodedObjectFor(DG). Defaults are Mem; *Os suffixes are Os specialisations.
# Method names camelCase (setRef, objectPacks, …).
# RepositoryFilesystem routes worktree vs commondir paths (gitrepository-layout).
package: storage/filesystem/dotgit
require:
  types:
    - RepositoryFilesystem
    - DotGit
    - DotGitMem
    - DotGitOs
    - DotGitFor
    - Options
    - ObjectWriter
    - ObjectWriterOs
    - ObjectWriterFor
    - PackWriter
    - PackWriterOs
    - PackWriterFor
    - EncodedObject
    - EncodedObjectOs
    - EncodedObjectFor
    - EncodedObjectReader
    - Error
  functions:
    - NewRepositoryFilesystem
    - New
    - NewEncodedObject
    - NewEncodedObjectOs
    - NewEncodedObjectFor
    - freeRef
    - freeRefs
    - freeHashes
    - freeAlternates
    - readFileAll
  constants:
    - ErrNotFound
    - ErrIdxNotFound
    - ErrPackfileNotFound
    - ErrConfigNotFound
    - ErrPackedRefsDuplicatedRef
    - ErrPackedRefsBadFormat
    - ErrEmptyRefFile
    - ErrModuleNameEscape
    - ErrReferenceNameEscape
    - ErrIsDir
    - ErrReferenceHasChanged
    - ErrSymRefTargetNotFound
  semantic:
    - RepositoryFilesystem
    - newRepositoryFilesystem
    - DotGit
    - DotGitMem
    - DotGitOs
    - DotGitFor
    - Options
    - ObjectWriter
    - ObjectWriterOs
    - ObjectWriterFor
    - PackWriter
    - PackWriterOs
    - PackWriterFor
    - EncodedObject
    - EncodedObjectOs
    - EncodedObjectFor
    - EncodedObjectReader
    - Error
    - DotGit.init
    - DotGit.new
    - DotGit.deinit
    - DotGit.initialize
    - DotGit.close
    - DotGit.config
    - DotGit.configWriter
    - DotGit.index
    - DotGit.indexWriter
    - DotGit.shallow
    - DotGit.shallowWriter
    - DotGit.objectPacks
    - DotGit.objectPack
    - DotGit.objectPackIdx
    - DotGit.newObject
    - DotGit.newObjectPack
    - DotGit.objects
    - DotGit.objectsWithPrefix
    - DotGit.objectStat
    - DotGit.deleteOldObjectPackAndIndex
    - DotGit.forEachObjectHash
    - DotGit.object
    - DotGit.objectDelete
    - DotGit.objectPath
    - DotGit.setRef
    - DotGit.refs
    - DotGit.ref
    - DotGit.removeRef
    - DotGit.countLooseRefs
    - DotGit.packRefs
    - DotGit.module
    - DotGit.addAlternate
    - DotGit.alternates
    - DotGit.fsPtr
    - DotGit.filesystem
    - ObjectWriter.open
    - ObjectWriter.writeHeader
    - ObjectWriter.write
    - ObjectWriter.hash
    - ObjectWriter.close
    - ObjectWriter.abandon
    - PackWriter.open
    - PackWriter.write
    - PackWriter.close
    - PackWriter.abandon
    - PackWriter.packChecksum
    - newEncodedObject
    - newEncodedObjectOs
    - newEncodedObjectFor
    - EncodedObject.hash
    - EncodedObject.objectType
    - EncodedObject.size
    - EncodedObject.setType
    - EncodedObject.setSize
    - EncodedObject.writer
    - EncodedObject.reader
    - EncodedObjectOs.hash
    - EncodedObjectOs.reader
    - EncodedObjectReader.read
    - EncodedObjectReader.hash
    - EncodedObjectReader.close
    - freeRef
    - freeRefs
    - freeHashes
    - freeAlternates
    - DotGit.freeAlternates
    - Options.alternates_fs
    - Options.exclusive_access
    - Options.keep_descriptors
    - readFileAll
    - Error.NotFound
    - Error.IdxNotFound
    - Error.PackfileNotFound
    - Error.ConfigNotFound
    - Error.PackedRefsDuplicatedRef
    - Error.PackedRefsBadFormat
    - Error.EmptyRefFile
    - Error.ReferenceNameEscape
    - Error.ModuleNameEscape
    - Error.IsDir
    - Error.ReferenceHasChanged
    - Error.SymRefTargetNotFound
zig_map:
  DotGit: DotGit
  DotGitMem: DotGitMem
  DotGitOs: DotGitOs
  DotGitFor: DotGitFor
  Options: Options
  ObjectWriter: ObjectWriter
  ObjectWriterOs: ObjectWriterOs
  ObjectWriterFor: ObjectWriterFor
  PackWriter: PackWriter
  PackWriterOs: PackWriterOs
  PackWriterFor: PackWriterFor
  EncodedObject: EncodedObject
  EncodedObjectOs: EncodedObjectOs
  EncodedObjectFor: EncodedObjectFor
  EncodedObjectReader: EncodedObjectReader
  Error: Error
  New: new
  NewEncodedObject: newEncodedObject
  NewEncodedObjectOs: newEncodedObjectOs
  NewEncodedObjectFor: newEncodedObjectFor
  ErrNotFound: Error.NotFound
  ErrIdxNotFound: Error.IdxNotFound
  ErrPackfileNotFound: Error.PackfileNotFound
  ErrConfigNotFound: Error.ConfigNotFound
  ErrPackedRefsDuplicatedRef: Error.PackedRefsDuplicatedRef
  ErrPackedRefsBadFormat: Error.PackedRefsBadFormat
  ErrEmptyRefFile: Error.EmptyRefFile
  ErrModuleNameEscape: Error.ModuleNameEscape
  ErrReferenceNameEscape: Error.ReferenceNameEscape
  ErrIsDir: Error.IsDir
  ErrReferenceHasChanged: Error.ReferenceHasChanged
  ErrSymRefTargetNotFound: Error.SymRefTargetNotFound
  freeRef: freeRef
  freeRefs: freeRefs
  freeHashes: freeHashes
  freeAlternates: freeAlternates
  readFileAll: readFileAll
  RepositoryFilesystem: RepositoryFilesystem
  NewRepositoryFilesystem: newRepositoryFilesystem
