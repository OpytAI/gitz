# Go NewMemoryIndex/NewDecoder/NewEncoder/NewWriter map to Zig *.init.
package: plumbing/format/idxfile
require:
  types:
    - MemoryIndex
    - Entry
    - EntryIterator
    - OffsetEntryIterator
    - Decoder
    - Encoder
    - Writer
  functions:
    - NewMemoryIndex
    - NewDecoder
    - NewEncoder
    - NewWriter
  constants:
    - VersionSupported
    - idxHeader
  semantic:
    - MemoryIndex
    - MemoryIndex.init
    - MemoryIndex.deinit
    - MemoryIndex.contains
    - MemoryIndex.findOffset
    - MemoryIndex.findCRC32
    - MemoryIndex.findHash
    - MemoryIndex.count
    - MemoryIndex.entries
    - MemoryIndex.entriesByOffset
    - Entry
    - EntryIterator
    - OffsetEntryIterator
    - Decoder
    - Decoder.init
    - Decoder.initWithSize
    - Decoder.decode
    - Encoder
    - Encoder.init
    - Encoder.encode
    - Writer
    - Writer.init
    - Writer.deinit
    - Writer.getIndex
    - Writer.add
    - Writer.isFinished
    - Writer.onHeader
    - Writer.onInflatedObjectContent
    - Writer.onFooter
    - VersionSupported
    - idxHeader
zig_map:
  MemoryIndex: MemoryIndex
  Entry: Entry
  EntryIterator: EntryIterator
  OffsetEntryIterator: OffsetEntryIterator
  Decoder: Decoder
  Encoder: Encoder
  Writer: Writer
  NewMemoryIndex: MemoryIndex.init
  NewDecoder: Decoder.init
  NewEncoder: Encoder.init
  NewWriter: Writer.init
  VersionSupported: VersionSupported
  idxHeader: idxHeader
