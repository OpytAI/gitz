# Metrics thresholds checked by //check:metrics.
# Metrics are computed from inventories/ and data/; failing thresholds fail the test.

pin:
  # Must equal inventories/packages.yaml pin and GO_GIT_PIN.md.
  expected: v5.19.2

packages:
  # At least this many package rows (required + excluded + test_only).
  min_total: 50
  # Required package surface.
  min_required: 40
  # Every required package must be present.
  max_missing: 0

api:
  # Count of inventories/api/*.yaml.
  min_files: 62
  # zig_map coverage of required API names.
  min_mapped_ratio: 0.5

goldens:
  # Number of golden case directories under data/goldens.
  min_count: 81

allowlists:
  # The final tree carries no accepted gaps.
  max_active: 0
